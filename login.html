<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | RideConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-car-side"></i>
        <span>RideConnect</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Find a Ride</a></li>
        <li><a href="register.html" class="nav-link">Create Account</a></li>
      </ul>

      <div class="nav-auth">
        <a href="register.html" class="btn btn-outline btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Main -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-car-side"></i>
        </div>
        <h1 class="auth-card-title">Welcome Back</h1>
        <p class="auth-card-subtitle">Sign in to your RideConnect account</p>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="login-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="height: 46px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </div>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';
        await window.RideConnect.login(email, password);
        window.showToast("Logged in successfully! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        console.error("Firebase Login Error:", err);
        window.showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
      }
    });
  </script>
</body>
</html>
