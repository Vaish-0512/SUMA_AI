<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | RideConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-car-side"></i>
        <span>RideConnect</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Find a Ride</a></li>
        <li><a href="login.html" class="nav-link">Log In</a></li>
      </ul>

      <div class="nav-auth">
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Main -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="auth-card-title">Join RideConnect</h1>
        <p class="auth-card-subtitle">Create an account to start sharing and booking rides</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="reg-name"><i class="fa-regular fa-user"></i> Full Name</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="reg-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.15rem;">
          <label for="reg-phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="reg-password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block" style="height: 46px;">
          <i class="fa-solid fa-user-check"></i> Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in</a>
      </div>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('reg-submit-btn');

      try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
        await window.RideConnect.register(name, email, password, phone);
        window.showToast("Account created successfully! Welcome aboard.", "success");
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 900);
      } catch (err) {
        console.error("Firebase Registration Error:", err);
        window.showToast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Complete Registration';
      }
    });
  </script>
</body>
</html>
